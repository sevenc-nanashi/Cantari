[package]
name = "worldline"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0.100"
dlopen2 = "0.8.2"
once_cell = "1.21.3"
tokio = { version = "1.49.0", features = ["rt"] }
tracing = "0.1.44"

[build-dependencies]
duct = "1.1.1"

[dev-dependencies]
wav_io = "0.1.15"
assets.workspace = true
encoding_rs = "0.8.35"
regex = "1.12.2"
regex-macro = "0.3.0"
tracing-subscriber = "0.3.22"

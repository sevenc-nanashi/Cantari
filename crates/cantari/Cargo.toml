[package]
name = "cantari"
version = "0.0.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", features = ["json"] }
base64 = "0.22.1"
clap = { version = "4.5.54", features = ["derive"] }
once_cell = "1.21.3"
open = "5.3.3"
process_path = "0.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.19.0", features = ["v5", "v4", "serde"] }
wav_io = "0.1.15"
dirs = "6.0.0"
worldline.workspace = true
voicevox_core = { git = "https://github.com/voicevox/voicevox_core.git", rev = "be8d0c0" }
regex = "1.12.2"
regex-macro = "0.3.0"
encoding_rs = "0.8.35"
image = "0.25.9"
assets.workspace = true
camino = "1.2.2"
duplicate = "2.0.1"
walkdir = "2.5.0"
unicode-jp = "0.4.0"
fs-err = { version = "3.2.2", features = ["tokio"] }
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
rmp-serde = "1.3.1"
async-walkdir = "2.1.0"
async-recursion = "1.1.1"
tempfile = "3.24.0"
futures = "0.3.31"
serde_with = { version = "3.16.1", features = ["base64"] }
educe = { version = "0.6.0", features = ["Debug"] }
itertools = "0.14.0"

[dev-dependencies]
cargo-license = "0.7.0"
